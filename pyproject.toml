[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "super-resolution-claim-audit"
version = "0.1.0"
description = "Offline documentation audit for learned picture enlargement"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
[project.scripts]
super-resolution-claim-audit = "super_resolution_claim_audit.audit:main"
[tool.setuptools.packages.find]
include = ["super_resolution_claim_audit*"]
